name: Extract Smart Teacher Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q amoozegar-hooshmand-2000q.zip -d extracted
          cp -a extracted/amoozegar-hooshmand/. .
          rm -rf extracted
          rm -f amoozegar-hooshmand-2000q.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract Smart Teacher project"
          git push
